<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <linearGradient id="navGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#091427" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#f8fafc" />

  <!-- LEFT SIDEBAR -->
  <g id="sidebar">
    <rect x="0" y="0" width="220" height="680" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Brand Logo -->
    <rect x="20" y="24" width="26" height="26" rx="6" fill="#2563eb" />
    <path d="M33 30 L35 34 L39 34 L36 37 L37 41 L33 38 L29 41 L30 37 L27 34 L31 34 Z" fill="#ffffff" />
    <text x="54" y="42" font-size="16" font-weight="700" fill="#1e293b">VA Hub</text>
    <text x="20" y="65" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1">MULTI-CLIENT EXECUTIVE SUITE</text>
    
    <!-- Navigation Items -->
    <!-- Dashboard (Active) -->
    <rect x="12" y="88" width="196" height="38" rx="8" fill="#eff6ff" />
    <circle cx="26" cy="107" r="3.5" fill="#2563eb" />
    <text x="38" y="112" font-size="13" font-weight="600" fill="#2563eb">Dashboard</text>
    
    <!-- Other Nav Items -->
    <circle cx="26" cy="147" r="3" fill="#94a3b8" />
    <text x="38" y="152" font-size="13" font-weight="500" fill="#64748b">Workspace Agent</text>
    
    <circle cx="26" cy="187" r="3" fill="#94a3b8" />
    <text x="38" y="192" font-size="13" font-weight="500" fill="#64748b">Clients</text>
    <rect x="180" y="180" width="18" height="18" rx="5" fill="#f1f5f9" />
    <text x="186" y="193" font-size="11" font-weight="600" fill="#64748b">2</text>
    
    <circle cx="26" cy="227" r="3" fill="#94a3b8" />
    <text x="38" y="232" font-size="13" font-weight="500" fill="#64748b">Weekly Digest</text>
    
    <circle cx="26" cy="267" r="3" fill="#94a3b8" />
    <text x="38" y="272" font-size="13" font-weight="500" fill="#64748b">Meeting Prep</text>
    
    <circle cx="26" cy="307" r="3" fill="#94a3b8" />
    <text x="38" y="312" font-size="13" font-weight="500" fill="#64748b">Email Assistant</text>
    
    <circle cx="26" cy="347" r="3" fill="#94a3b8" />
    <text x="38" y="352" font-size="13" font-weight="500" fill="#64748b">Content Calendar</text>
    
    <circle cx="26" cy="387" r="3" fill="#94a3b8" />
    <text x="38" y="392" font-size="13" font-weight="500" fill="#64748b">Receipt Logger</text>
    
    <circle cx="26" cy="427" r="3" fill="#94a3b8" />
    <text x="38" y="432" font-size="13" font-weight="500" fill="#64748b">Activity Logs</text>

    <!-- Sidebar Bottom: Google Workspace Account Box -->
    <rect x="14" y="585" width="192" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <circle cx="28" cy="605" r="4" fill="#22c55e" />
    <text x="38" y="608" font-size="9" font-weight="700" fill="#15803d" letter-spacing="0.5">GOOGLE WORKSPACE</text>
    <text x="28" y="626" font-size="11.5" font-weight="500" fill="#1e293b">liwaglord@gmail.com</text>
    <path d="M190 606 L195 611 L190 616" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <text x="20" y="662" font-size="9.5" fill="#94a3b8">Privacy &amp; Legal Terms</text>
    <text x="180" y="662" font-size="9.5" fill="#94a3b8">v1.4</text>
  </g>

  <!-- MAIN VIEW AREA -->
  <g id="main-content">
    <!-- Top Header Bar -->
    <text x="248" y="46" font-size="20" font-weight="700" fill="#0f172a">Morning Overview — September 22</text>
    
    <!-- Top Action Buttons -->
    <!-- Client Workspace Selector Pill -->
    <rect x="620" y="24" width="138" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="636" cy="41" r="10" fill="#eff6ff" />
    <text x="633" y="45" font-size="10" font-weight="700" fill="#2563eb">T</text>
    <text x="652" y="38" font-size="10.5" font-weight="600" fill="#1e293b">Test Client (1)</text>
    <text x="652" y="49" font-size="8.5" fill="#64748b">TEST (Sandbox) ▾</text>

    <!-- Data Isolation Audit -->
    <rect x="768" y="24" width="140" height="34" rx="17" fill="#ffffff" stroke="#dcfce7" stroke-width="1" />
    <circle cx="783" cy="41" r="5" fill="#22c55e" />
    <text x="796" y="45" font-size="11" font-weight="600" fill="#15803d">Data Isolation Audit</text>

    <!-- Voice Note Button -->
    <rect x="918" y="24" width="102" height="34" rx="17" fill="#4338ca" />
    <text x="933" y="45" font-size="11" font-weight="600" fill="#ffffff">🎙 Voice Note</text>

    <!-- Trigger All Syncs Button -->
    <rect x="1030" y="24" width="140" height="34" rx="17" fill="#60a5fa" />
    <text x="1046" y="45" font-size="11" font-weight="600" fill="#ffffff">🔄 Trigger All Syncs</text>

    <!-- CARD 1: Client Workspace Banner -->
    <g transform="translate(248, 76)">
      <rect width="922" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#eff6ff" />
      <path d="M28 26 L38 26 L38 40 L28 40 Z" fill="none" stroke="#2563eb" stroke-width="1.5" />
      
      <text x="60" y="30" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CLIENT WORKSPACE</text>
      <text x="180" y="30" font-size="12" font-weight="700" fill="#0f172a">Test Client (1)</text>
      <rect x="264" y="20" width="36" height="15" rx="4" fill="#f1f5f9" />
      <text x="270" y="31" font-size="9" font-weight="600" fill="#64748b">TEST</text>
      
      <circle cx="320" cy="27" r="3.5" fill="#f59e0b" />
      <text x="328" y="30" font-size="10.5" font-weight="500" fill="#d97706">No Google Account Connected</text>

      <text x="60" y="52" font-size="11.5" fill="#64748b">All emails, calendar events, sheets, receipts, and digests below operate strictly on this client's isolated workspace.</text>
      
      <rect x="760" y="18" width="146" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="774" y="37" font-size="11" font-weight="600" fill="#475569">Switch / Manage Clients &gt;</text>
    </g>

    <!-- CARD 2: AI Virtual Assistant for Google Workspace Banner -->
    <g transform="translate(248, 156)">
      <rect width="922" height="106" rx="12" fill="url(#aiCardGrad)" stroke="#1e3a8a" stroke-width="1" />
      
      <rect x="20" y="24" width="40" height="40" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="30" y="49" font-size="18">🤖</text>
      
      <text x="74" y="44" font-size="16" font-weight="700" fill="#ffffff">AI Virtual Assistant for Google Workspace</text>
      <rect x="400" y="30" width="112" height="20" rx="5" fill="#2563eb" />
      <text x="408" y="44" font-size="10" font-weight="600" fill="#ffffff">Cross-Tool Agent</text>
      
      <text x="74" y="68" font-size="12" fill="#93c5fd" width="600">Autonomously synthesizes Gmail communications, Google Calendar syncs, Drive SOPs, and Sheets deliverables</text>
      <text x="74" y="85" font-size="12" fill="#93c5fd">to prepare authoritative client briefing packages and generate live Google Docs.</text>
      
      <!-- Launch Meeting Agent Button -->
      <rect x="735" y="36" width="170" height="38" rx="10" fill="#2563eb" />
      <text x="752" y="60" font-size="12.5" font-weight="600" fill="#ffffff">✨ Launch Meeting Agent →</text>
    </g>

    <!-- CARD 3: Pending Approval Section -->
    <g transform="translate(248, 276)">
      <rect width="922" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      
      <!-- Card Header -->
      <rect x="20" y="20" width="32" height="32" rx="8" fill="#fef3c7" />
      <text x="28" y="42" font-size="16">🛡</text>
      
      <text x="64" y="42" font-size="16" font-weight="700" fill="#0f172a">Pending Approval</text>
      
      <!-- Pill: 0 Waiting Sign-Off -->
      <rect x="204" y="27" width="112" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
      <text x="214" y="42" font-size="10.5" font-weight="700" fill="#b45309">0 Waiting Sign-Off</text>
      
      <!-- Pill: Human-in-the-Loop Active -->
      <rect x="324" y="27" width="144" height="22" rx="11" fill="#f1f5f9" />
      <text x="334" y="42" font-size="10.5" font-weight="600" fill="#475569">Human-in-the-Loop Active</text>

      <!-- Category Filter Tabs -->
      <rect x="620" y="26" width="60" height="26" rx="6" fill="#0f172a" />
      <text x="635" y="43" font-size="11" font-weight="600" fill="#ffffff">All (0)</text>

      <rect x="686" y="26" width="82" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="696" y="43" font-size="11" font-weight="500" fill="#64748b">✉ Emails (0)</text>

      <rect x="774" y="26" width="90" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="784" y="43" font-size="11" font-weight="500" fill="#64748b">📅 Calendar (0)</text>

      <rect x="870" y="26" width="90" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="880" y="43" font-size="11" font-weight="500" fill="#64748b">🧾 Receipts (0)</text>

      <text x="64" y="70" font-size="12" fill="#64748b">Centralized approval gatekeeper. AI content from the Email Assistant (draft replies), Content Calendar (captions),</text>
      <text x="64" y="87" font-size="12" fill="#64748b">and Receipt Logger (extracted data) is staged here. Nothing sends, posts, or saves without your explicit approval.</text>

      <!-- Empty State Area -->
      <line x1="20" y1="110" x2="902" y2="110" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4 4" />
      
      <!-- Green Check Circle -->
      <circle cx="461" cy="180" r="28" fill="#dcfce7" />
      <path d="M451 180 L458 187 L471 173" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="461" y="235" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">All caught up! No pending approvals</text>
      <text x="461" y="260" font-size="12" fill="#64748b" text-anchor="middle">Zero unreviewed actions waiting. When the Email Assistant drafts a reply, the</text>
      <text x="461" y="278" font-size="12" fill="#64748b" text-anchor="middle">Content Calendar writes a caption, or the Receipt Logger scans an expense, it will stage here for your review.</text>
    </g>
  </g>
</svg>
