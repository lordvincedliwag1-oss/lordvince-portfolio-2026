<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="rateShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Warm background -->
  <rect width="1100" height="580" fill="#f5f2eb" />

  <!-- Top Navigation Bar -->
  <g id="navbar">
    <!-- Brand -->
    <text x="80" y="56" font-size="22" font-weight="800" fill="#111827" letter-spacing="-0.5">Rate<tspan fill="#2b826b">craft</tspan></text>
    
    <!-- Nav Links -->
    <text x="730" y="54" font-size="14" font-weight="500" fill="#4b5563">The problem</text>
    <text x="845" y="54" font-size="14" font-weight="500" fill="#4b5563">What's inside</text>
    <text x="965" y="54" font-size="14" font-weight="500" fill="#4b5563">FAQ</text>
  </g>

  <!-- Left Column: Hero Copy & Form -->
  <g id="hero-left">
    <text x="80" y="170" font-size="44" font-weight="800" fill="#111827" letter-spacing="-1.2">Stop losing</text>
    <text x="80" y="222" font-size="44" font-weight="800" fill="#111827" letter-spacing="-1.2">clients to “that’s</text>
    <text x="80" y="274" font-size="44" font-weight="800" fill="#111827" letter-spacing="-1.2">too expensive.”</text>

    <text x="80" y="325" font-size="15" fill="#4b5563" line-height="1.5">A free 20-minute training on how freelancers hold their</text>
    <text x="80" y="348" font-size="15" fill="#4b5563">rate in the moment a client pushes back — without</text>
    <text x="80" y="371" font-size="15" fill="#4b5563">sounding defensive, and without losing the job.</text>

    <!-- Email Opt-in Form -->
    <g transform="translate(80, 410)">
      <!-- Input -->
      <rect x="0" y="0" width="190" height="46" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
      <text x="14" y="28" font-size="14" fill="#9ca3af">you@email.com</text>

      <!-- Submit Button -->
      <rect x="198" y="0" width="182" height="46" rx="4" fill="#1c1d2e" />
      <text x="217" y="28" font-size="14" font-weight="700" fill="#ffffff">Send me the training</text>
    </g>

    <!-- Note under form -->
    <text x="80" y="482" font-size="12" fill="#6b7280">Free. Takes 20 minutes. No pitch fest, just the framework.</text>
  </g>

  <!-- Right Column: Clean Conversation Card -->
  <g id="hero-right" transform="translate(630, 140)">
    <!-- Container Card -->
    <rect width="390" height="340" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#rateShadow)" />
    
    <text x="24" y="38" font-size="12" fill="#6b7280">A real conversation, cleaned up</text>

    <!-- Chat Bubble 1 (Client) -->
    <g transform="translate(24, 60)">
      <rect width="250" height="66" rx="8" fill="#ede7dd" />
      <text x="14" y="25" font-size="13" fill="#1f2937">can we do $500 instead of $1,200?</text>
      <text x="14" y="45" font-size="13" fill="#1f2937">budget's tight on our end</text>
    </g>

    <!-- Chat Bubble 2 (Freelancer / Value Response) -->
    <g transform="translate(76, 144)">
      <rect width="290" height="106" rx="8" fill="#2b826b" />
      <text x="14" y="24" font-size="13" fill="#ffffff">totally understand — here's what's</text>
      <text x="14" y="44" font-size="13" fill="#ffffff">included at $1,200 [scope list].</text>
      <text x="14" y="64" font-size="13" fill="#ffffff">happy to adjust the scope to fit</text>
      <text x="14" y="84" font-size="13" fill="#ffffff">$500 if that's easier</text>
    </g>

    <!-- Chat Bubble 3 (Client Acceptance) -->
    <g transform="translate(24, 268)">
      <rect width="250" height="52" rx="8" fill="#ede7dd" />
      <text x="14" y="24" font-size="13" fill="#1f2937">let's just keep the full scope —</text>
      <text x="14" y="42" font-size="13" fill="#1f2937">$1,200 works</text>
    </g>
  </g>
</svg>
